<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Track your exercises</h1>
    <p class="subtitle">Pink &amp; blue theme • Data stored in cookies</p>

    <div class="email-section" id="email-section">
      <!-- filled by JS -->
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Type</th>
            <th>Distance (mi)</th>
            <th>Pace (min/mi)</th>
            <th>Temp (°F)</th>
            <th>Weather</th>
            <th>Comments</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="workout-tbody">
          <!-- filled by JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
