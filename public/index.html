<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Workout Tracker</h1>
    <p class="subtitle">Track your walks, runs, swims, bikes & more</p>

    <form id="workout-form">
      <h2 id="form-title">Add New Workout</h2>

      <div class="form-row">
        <label for="date">Date</label>
        <input type="date" id="date" required>
      </div>

      <div class="form-row">
        <label for="time">Time</label>
        <input type="time" id="time" required>
      </div>

      <div class="form-row">
        <label for="type">Workout Type</label>
        <select id="type" required>
          <option value="">Select type</option>
          <option value="walk">Walk</option>
          <option value="run">Run</option>
          <option value="swim">Swim</option>
          <option value="bike">Bike</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-row">
        <label for="distance">Distance (miles)</label>
        <input type="number" id="distance" step="0.01" min="0" required>
      </div>

      <div class="form-row">
        <label for="pace">Pace (min/mile)</label>
        <input type="number" id="pace" step="0.01" min="0" required>
      </div>

      <div class="form-row">
        <label for="temp">Outside Temperature (°F)</label>
        <input type="number" id="temp" step="0.1">
      </div>

      <div class="form-row">
        <label for="weather">Weather Conditions</label>
        <input type="text" id="weather" placeholder="e.g. Sunny, Cloudy, Rain">
      </div>

      <div class="form-row">
        <label for="comments">Comments</label>
        <textarea id="comments" rows="3" placeholder="How did it feel?"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" id="submit-btn">Add Workout</button>
        <button type="button" id="cancel-btn" class="hidden">Cancel Edit</button>
      </div>
    </form>

    <h2>Your Workouts</h2>
    <div id="workouts-list">
      <!-- Workouts rendered here -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
