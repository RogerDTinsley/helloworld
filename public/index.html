<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Workout Tracker</h1>
    <p class="subtitle">Track your workouts</p>

    <div class="table-wrapper">
      <table id="workout-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Type</th>
            <th>Distance (mi)</th>
            <th>Pace (min/mi)</th>
            <th>Temp (°F)</th>
            <th>Weather</th>
            <th>Comments</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="workout-tbody">
          <!-- rows rendered by script -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
